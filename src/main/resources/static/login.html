<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | Vehicle Management System</title>
<link rel="stylesheet" href="/css/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="public-page">

  <header class="public-header">
    <a href="/landing.html" style="text-decoration:none">
      <div class="brand">
        <div class="brand-icon">🚗</div>
        <div class="brand-text">VMS<small>Vehicle Mgmt</small></div>
      </div>
    </a>
    <nav class="public-header-nav">
      <a href="/landing.html">Home</a>
      <a href="/register.html" class="btn btn-primary">Sign Up</a>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-title">Welcome back 👋</div>
      <div class="auth-subtitle">Login to access your dashboard</div>

      <div class="auth-error" id="authError"></div>

      <form class="auth-form" id="loginForm" onsubmit="onLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input id="email" type="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">🔐 Login</button>
      </form>

      <div class="auth-meta">
        Don't have an account? <a href="/register.html">Create one</a>
      </div>
    </div>
  </div>

  <footer class="public-footer">
    © 2026 Vehicle Management System – SE1020 Project
  </footer>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
// already logged in? send to dashboard
if (getCurrentUser()) location.href = '/dashboard';

async function onLogin(e) {
  e.preventDefault();
  const err = document.getElementById('authError');
  err.classList.remove('show');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in…';

  const body = {
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  };
  try {
    const res = await API.post('/api/auth/login', body);
    setCurrentUser(res.user);
    location.href = '/dashboard';
  } catch (ex) {
    let msg = 'Invalid email or password';
    const m = (ex.message || '').match(/\{.*\}/);
    if (m) {
      try { msg = JSON.parse(m[0]).error || msg; } catch (_) {}
    }
    err.textContent = msg;
    err.classList.add('show');
    btn.disabled = false; btn.textContent = '🔐 Login';
  }
}
</script>
</body>
</html>
