spring.application.name=vehicle-management-system
server.port=8080

# Use ISO datetime in JSON (compatible with HTML datetime-local input)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# Static resources caching disabled for dev
spring.web.resources.cache.period=0
